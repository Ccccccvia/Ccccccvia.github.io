<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Defined array order versus numeric sorted order</title>
  <desc id="desc">The original array has 30, 10, and 20 at indices zero, one, and two. A numeric comparator a minus b produces a new array containing 10, 20, and 30. The original array is unchanged.</desc>
  <defs>
    <linearGradient id="night" x1="40" y1="40" x2="740" y2="530" gradientUnits="userSpaceOnUse"><stop stop-color="#171d32"/><stop offset=".55" stop-color="#34304e"/><stop offset="1" stop-color="#50405e"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#85acb0" stop-opacity=".16"/><stop offset="1" stop-color="#85acb0" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" stroke="#c4c8cc" stroke-opacity=".045"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 5 3-5 3" stroke="#85acb0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <path d="M0 0h800v570H0z" fill="url(#night)"/>
  <path d="M36 36h728v493H36z" fill="url(#grid)"/>
  <ellipse cx="405" cy="292" rx="308" ry="224" fill="url(#glow)"/>
  <path d="M36 78V36h42M722 36h42v42M36 487v42h42M722 529h42v-42" stroke="#c5ab7d" stroke-opacity=".5"/>
  <g font-family="monospace">
    <text x="400" y="83" text-anchor="middle" fill="#d3c2a4" font-size="20" letter-spacing="2">ORDERED IS NOT SORTED</text>
    <g font-size="15" fill="#bcb1c3" text-anchor="middle"><text x="274" y="142">index 0</text><text x="444" y="142">index 1</text><text x="614" y="142">index 2</text></g>
    <text x="74" y="194" fill="#c5ab7d" font-size="17">ORIGINAL</text>
    <text x="74" y="219" fill="#bcb1c3" font-size="13">has order</text>
    <g fill="#8e7655" fill-opacity=".18" stroke="#c5ab7d" stroke-width="2"><rect x="205" y="164" width="138" height="78" rx="12"/><rect x="375" y="164" width="138" height="78" rx="12"/><rect x="545" y="164" width="138" height="78" rx="12"/></g>
    <g fill="#e0c99f" font-size="36" text-anchor="middle"><text x="274" y="215">30</text><text x="444" y="215">10</text><text x="614" y="215">20</text></g>
    <path d="M348 203h22m-5-5 5 5-5 5M518 203h22m-5-5 5 5-5 5" stroke="#c5ab7d" stroke-opacity=".65" stroke-width="1.5"/>
    <path d="M444 251v34M444 333v35" stroke="#85acb0" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="200" y="290" width="488" height="39" rx="10" fill="#1e293d" stroke="#85acb0" stroke-opacity=".5"/>
    <text x="444" y="315" text-anchor="middle" fill="#b5d4d3" font-size="17">toSorted((a, b) =&gt; a - b)</text>
    <text x="74" y="407" fill="#85acb0" font-size="17">NEW COPY</text>
    <text x="74" y="432" fill="#bcb1c3" font-size="13">ascending</text>
    <g fill="#628c95" fill-opacity=".18" stroke="#85acb0" stroke-width="2"><rect x="205" y="379" width="138" height="78" rx="12"/><rect x="375" y="379" width="138" height="78" rx="12"/><rect x="545" y="379" width="138" height="78" rx="12"/></g>
    <g fill="#b5d4d3" font-size="36" text-anchor="middle"><text x="274" y="430">10</text><text x="444" y="430">20</text><text x="614" y="430">30</text></g>
    <g fill="#85acb0" font-size="21" text-anchor="middle"><text x="359" y="426">&lt;</text><text x="529" y="426">&lt;</text></g>
    <path d="M697 203h19v276H205" stroke="#c5ab7d" stroke-opacity=".4" stroke-dasharray="4 6"/>
    <circle cx="205" cy="479" r="3" fill="#c5ab7d"/>
    <text x="444" y="509" text-anchor="middle" fill="#d3c2a4" font-size="16">original stays [30, 10, 20]</text>
  </g>
</svg>
