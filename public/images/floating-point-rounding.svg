    <text x="386" y="153" fill="#ddd1e1" font-size="31">0.3</text>
    <text x="386" y="182" fill="#bcacc9" font-size="17" letter-spacing="2">EXACT</text>
    <path d="M386 196v77" stroke="#c8b4d4" stroke-width="1.5" stroke-dasharray="4 5"/>
    <rect x="350" y="264" width="180" height="46" rx="10" fill="#c4b18d" fill-opacity=".08"/>
    <path d="M83 287h647m-9-6 9 6-9 6" stroke="#adbbc1" stroke-opacity=".65" stroke-width="2"/>
    <g stroke="#99a6b6" stroke-width="2" opacity=".5"><path d="M170 273v28M710 273v28"/><circle cx="170" cy="287" r="5" fill="#8796ac"/><circle cx="710" cy="287" r="5" fill="#8796ac"/></g>
    <circle cx="350" cy="287" r="22" stroke="#d4b982" stroke-opacity=".35"/>
    <circle cx="350" cy="287" r="11" fill="#d4b982" stroke="#e8d7b1" stroke-width="2"/>
    <circle cx="530" cy="287" r="22" stroke="#8ebbc0" stroke-opacity=".35"/>
    <circle cx="530" cy="287" r="11" fill="#8ebbc0" stroke="#c3dfde" stroke-width="2"/>
    <path d="m386 277 8 10-8 10-8-10Z" fill="#c9b6d6"/>
