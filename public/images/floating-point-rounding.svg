<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Two adjacent binary64 values surrounding exact 0.3</title>
  <desc id="desc">A schematic magnified number line. The stored literal 0.3 is the lower point, and 0.1 plus 0.2 is the adjacent upper point. They are separated by two to the power minus 54. Exact mathematical 0.3 lies between them, closer to the lower point.</desc>
