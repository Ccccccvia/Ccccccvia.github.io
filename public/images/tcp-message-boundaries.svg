<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">TCP preserves byte order while read boundaries change</title>
  <desc id="desc">Two writes group A B and C D E. The stream is A B C D E. Three possible reads group A, B C D, and E, retaining the same byte order.</desc>
