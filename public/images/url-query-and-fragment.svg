<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Query to the server, fragment to the page</title>
  <desc id="desc">A segmented example URL routes its path and query into an HTTP request, while the fragment points to a shipping section in the browser. A dashed return path notes that a script may explicitly send fragment data.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="800" y2="570" gradientUnits="userSpaceOnUse"><stop stop-color="#191e35"/><stop offset=".55" stop-color="#352c4b"/><stop offset="1" stop-color="#52405f"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#d8c5a5" stroke-opacity=".045"/></pattern>
    <marker id="gold-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4" fill="#d8b987"/></marker>
    <marker id="teal-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4" fill="#a4cdca"/></marker>
  </defs>
  <path d="M0 0h800v570H0z" fill="url(#night)"/>
  <path d="M0 0h800v570H0z" fill="url(#grid)"/>
  <g fill="#eadfc9" font-family="monospace">
    <text x="55" y="67" font-size="13" letter-spacing="3">08 / ADDRESS ROUTES</text>
    <text x="55" y="103" font-family="Georgia,serif" font-size="27">One URL. Two routes.</text>
  </g>
  <rect x="55" y="131" width="690" height="89" rx="12" fill="#211f35" stroke="#b9a6bf" stroke-opacity=".4"/>
  <path d="M275 132v87M395 132v87M552 132v87" stroke="#b9a6bf" stroke-opacity=".25"/>
  <path d="M277 133h273v85H277z" fill="#d8b987" fill-opacity=".1"/>
  <path d="M554 133h177q12 0 12 12v61q0 12-12 12H554z" fill="#a4cdca" fill-opacity=".13"/>
  <g font-family="monospace" font-size="15" text-anchor="middle">
    <text x="165" y="172" fill="#d6cbd8">https://example.org</text>
    <text x="335" y="172" fill="#ead2a8">/catalog</text>
    <text x="474" y="172" fill="#ead2a8">?sort=date</text>
    <text x="648" y="172" fill="#c4e5dd">#shipping</text>
  </g>
  <g font-family="monospace" font-size="10" letter-spacing="2" text-anchor="middle">
    <text x="165" y="202" fill="#b1a8c1">SCHEME + HOST</text>
    <text x="335" y="202" fill="#d8b987">PATH</text>
    <text x="474" y="202" fill="#d8b987">QUERY</text>
    <text x="648" y="202" fill="#a4cdca">FRAGMENT</text>
  </g>
  <path d="M335 221v20h139v-20M405 241v30H249v47" stroke="#d8b987" stroke-width="2" marker-end="url(#gold-arrow)"/>
  <path d="M648 221v97" stroke="#a4cdca" stroke-width="2" marker-end="url(#teal-arrow)"/>
  <text x="89" y="292" font-family="monospace" font-size="12" fill="#d8b987">HTTP REQUEST TARGET</text>
  <text x="523" y="292" font-family="monospace" font-size="12" fill="#a4cdca">LOCAL PAGE TARGET</text>
  <rect x="74" y="326" width="367" height="128" rx="13" fill="#28263d" stroke="#d8b987" stroke-opacity=".7"/>
  <path d="M74 357h367" stroke="#d8b987" stroke-opacity=".3"/>
  <circle cx="94" cy="342" r="3" fill="#d8b987"/>
  <text x="108" y="346" font-family="monospace" font-size="11" letter-spacing="2" fill="#d8b987">SERVER</text>
  <g font-family="monospace" font-size="13" fill="#ead9bc">
    <text x="94" y="386">GET /catalog?sort=date HTTP/1.1</text>
    <text x="94" y="410">Host: example.org</text>
    <text x="94" y="437" font-size="11" fill="#b8aabc">no fragment in this target</text>
  </g>
  <rect x="488" y="326" width="238" height="128" rx="13" fill="#243340" stroke="#a4cdca" stroke-opacity=".8"/>
  <path d="M488 357h238" stroke="#a4cdca" stroke-opacity=".35"/>
  <g fill="#a4cdca"><circle cx="506" cy="342" r="2.5"/><circle cx="517" cy="342" r="2.5"/><circle cx="528" cy="342" r="2.5"/></g>
  <text x="545" y="346" font-family="monospace" font-size="11" letter-spacing="2" fill="#a4cdca">BROWSER</text>
  <path d="M508 374h110M508 384h74" stroke="#a4cdca" stroke-opacity=".35" stroke-width="3"/>
  <rect x="503" y="399" width="208" height="40" rx="5" fill="#a4cdca" fill-opacity=".12" stroke="#a4cdca" stroke-opacity=".65"/>
  <path d="M518 409v20m-6-8 6 8 6-8" stroke="#a4cdca" stroke-width="1.5"/>
  <text x="541" y="424" font-family="monospace" font-size="13" fill="#c4e5dd">id="shipping"</text>
  <path d="M605 456v29H249v-27" stroke="#aaa0b9" stroke-width="1.4" stroke-dasharray="4 6" marker-end="url(#gold-arrow)"/>
  <rect x="323" y="474" width="220" height="22" rx="6" fill="#3e324e"/>
  <text x="433" y="489" text-anchor="middle" font-family="monospace" font-size="11" fill="#d5c9db">script may explicitly send it</text>
  <text x="400" y="524" text-anchor="middle" font-family="monospace" font-size="12" fill="#c8bdbe">CLIENT-SIDE ≠ SECRET STORAGE</text>
</svg>
