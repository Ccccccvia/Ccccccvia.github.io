  <path d="M55 499h690" stroke="#d9c4a1" stroke-opacity=".3"/>
  <text x="400" y="523" text-anchor="middle" font-family="monospace" font-size="12" fill="#c8bdbe">FEWER ROUND TRIPS ≠ LESS WORK IN EVERY PLAN</text>
