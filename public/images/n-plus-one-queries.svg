<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Thirteen query trips versus two batches</title>
  <desc id="desc">One author query and twelve separate book queries fan out on the left. On the right one author query and one batch book query lead to grouping by author identifier.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="800" y2="570" gradientUnits="userSpaceOnUse"><stop stop-color="#171d34"/><stop offset=".55" stop-color="#332b49"/><stop offset="1" stop-color="#50405d"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#d8c5a5" stroke-opacity=".045"/></pattern>
    <marker id="gold-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="m0 0 8 4-8 4" fill="#d3b47e"/></marker>
    <marker id="teal-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="m0 0 8 4-8 4" fill="#9fc9c6"/></marker>
  </defs>
  <path fill="url(#night)" d="M0 0h800v570H0z"/>
  <path fill="url(#grid)" d="M0 0h800v570H0z"/>
  <g font-family="monospace" fill="#eadfc9">
    <text x="55" y="67" font-size="13" letter-spacing="3">07 / QUERY TOPOLOGY</text>
    <text x="55" y="103" font-family="Georgia,serif" font-size="27">Many trips. One batch.</text>
  </g>
